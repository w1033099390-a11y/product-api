<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalogue API</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f4; color: #1c1917; }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #e7e5e4; padding: 12px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 8px 0 0; }
  .seg button { border: 1px solid #d6d3d1; background: #fff; padding: 6px 14px; cursor: pointer; font-size: 14px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .seg button.on { background: #1c1917; color: #fff; border-color: #1c1917; }
  input { flex: 1; min-width: 200px; padding: 7px 10px; border: 1px solid #d6d3d1; border-radius: 6px; font-size: 14px; }
  .count { font-size: 13px; color: #78716c; }
  main { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; overflow: hidden; cursor: pointer; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; display: block; }
  .card .t { padding: 10px 12px 4px; font-size: 13px; line-height: 1.35; }
  .card .r { padding: 0 12px 10px; font-size: 12px; color: #78716c; }
  .card .pr { padding: 0 12px 12px; margin-top: -4px; font-size: 14px; font-weight: 600; }
  .detail { display: none; background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; padding: 20px; max-width: 1100px; margin: 0 auto; }
  .detail.on { display: block; }
  .back { background: none; border: 0; color: #2563eb; cursor: pointer; font-size: 14px; padding: 0; margin-bottom: 12px; }
  .top { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 24px; }
  @media (max-width: 760px) { .top { grid-template-columns: 1fr; } }
  .main-img { width: 100%; aspect-ratio: 1; object-fit: contain; border: 1px solid #e7e5e4; border-radius: 8px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs img { width: 56px; height: 56px; object-fit: contain; border: 1px solid #e7e5e4; border-radius: 6px; cursor: pointer; }
  h2 { font-size: 20px; margin: 0 0 6px; line-height: 1.3; }
  h3 { font-size: 15px; margin: 22px 0 8px; }
  .muted { color: #78716c; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { border-bottom: 1px solid #f0efee; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { color: #57534e; font-weight: 600; background: #fafaf9; }
  .tag { display: inline-block; background: #f5f5f4; border-radius: 4px; padding: 2px 7px; font-size: 12px; margin: 2px 4px 2px 0; }
  .yes { color: #15803d; font-weight: 600; }
  .desc { font-size: 14px; line-height: 1.55; }
  .desc img { max-width: 100%; height: auto; }
  .json { font-size: 13px; }
  .json a { color: #2563eb; }
</style>
</head>
<body>
<header>
  <h1>Product Catalogue API</h1>
  <div class="seg"><button data-l="en" class="on">English</button><button data-l="el">Ελληνικά</button></div>
  <input id="q" placeholder="Search name, model or reference…">
  <span class="count" id="count"></span>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="detail" id="detail"></div>
</main>
<script>
let lang = 'en', items = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  const r = await fetch(`v1/${lang}/products.json`);
  items = (await r.json()).items;
  await imgMapReady;
  render();
  if (location.hash.startsWith('#p')) show(location.hash.slice(2));
}
const money = (v, c) => new Intl.NumberFormat(lang === 'el' ? 'el-GR' : 'en-GB', { style: 'currency', currency: c || 'EUR' }).format(v);
// Bundled images (img/map.json) are used when present; otherwise the original image URLs.
let imgMap = null;
const imgMapReady = fetch('img/map.json').then(r => r.ok ? r.json() : null).then(m => imgMap = m).catch(() => null);
const local = (id, i) => imgMap && imgMap[id] && imgMap[id][i] || null;
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = q ? items.filter(p => (p.name + ' ' + p.reference + ' ' + (p.models || []).join(' ')).toLowerCase().includes(q)) : items;
  $('#count').textContent = `${list.length} / ${items.length} products`;
  $('#grid').innerHTML = list.map(p => `
    <div class="card" onclick="location.hash='p${p.id}'">
      <img loading="lazy" src="${esc(local(p.id, 0) || p.image.replace('image_1920','image_512'))}" alt="">
      <div class="t">${esc(p.name)}</div>
      <div class="r">${esc(p.reference)} · ID ${p.id}</div>
      ${p.price_from != null ? `<div class="pr">${lang==='el'?'από':'from'} ${money(p.price_from, p.currency)}</div>` : ''}
    </div>`).join('');
}
async function show(id) {
  const p = await (await fetch(`v1/${lang}/products/${id}.json`)).json();
  $('#grid').style.display = 'none';
  const d = $('#detail'); d.classList.add('on');
  // With bundled images, show only those (external images may be blocked); otherwise all remote sizes
  const gallery = imgMap && imgMap[p.id]
    ? imgMap[p.id].filter(Boolean).map(u => ({ big: u, small: u }))
    : p.images.map(im => ({ big: im.sizes['1024'], small: im.sizes['128'] }));
  if (!gallery.length) gallery.push({ big: '', small: '' });
  const L = lang === 'el'
    ? {feat:'Τεχνικά χαρακτηριστικά', vars:'Παραλλαγές', cats:'Κατηγορίες', desc:'Περιγραφή'}
    : {feat:'Specifications', vars:'Variants', cats:'Categories', desc:'Description'};
  d.innerHTML = `
    <button class="back" onclick="location.hash=''">← Back to list</button>
    <div class="top">
      <div>
        <img class="main-img" id="mi" src="${esc(gallery[0].big)}" alt="">
        <div class="thumbs">${gallery.map(g => `<img src="${esc(g.small)}" onclick="$('#mi').src='${esc(g.big)}'">`).join('')}</div>
      </div>
      <div>
        <h2>${esc(p.name)}</h2>
        <div class="muted">ID ${p.id} · ${esc(p.reference)}${p.brand ? ' · ' + esc(p.brand.name) : ''}</div>
        <div class="desc">${p.short_description || ''}</div>
        <h3>${L.cats}</h3>
        ${p.categories.map(c => `<span class="tag">${esc(c.name)}</span>`).join('')}
        <p class="json">JSON: <a href="v1/${lang}/products/${p.id}.json" target="_blank">v1/${lang}/products/${p.id}.json</a></p>
      </div>
    </div>
    <h3>${L.vars} (${p.variants.length})</h3>
    <table><tr><th>${lang==='el'?'Μοντέλο':'Model'}</th><th>SKU</th><th>EAN</th><th>${lang==='el'?'Επιλογές':'Options'}</th><th>cm</th><th>kg</th><th>${lang==='el'?'Τιμή':'Price'}</th><th>Listed</th></tr>
      ${p.variants.map(v => `<tr><td>${esc(v.model ?? '–')}</td><td>${esc(v.reference)}</td><td>${esc(v.barcode)}</td>
        <td>${v.options.map(o => esc(o.option + ': ' + o.value)).join('<br>')}</td>
        <td>${[v.dimensions_cm.length, v.dimensions_cm.width, v.dimensions_cm.height].map(x => x ?? '–').join(' × ')}</td>
        <td>${v.weight_kg ?? '–'}</td><td>${v.price != null ? money(v.price, v.currency) : '–'}</td><td>${v.listed ? '<span class="yes">✓</span>' : ''}</td></tr>`).join('')}
    </table>
    <h3>${L.feat}</h3>
    <table>${p.features.map(f => `<tr><th style="width:40%">${esc(f.name)}</th><td>${esc(f.value)}</td></tr>`).join('')}</table>
    <h3>${L.desc}</h3>
    <div class="desc">${p.description || ''}</div>`;
  window.scrollTo(0, 0);
}
function back() { $('#detail').classList.remove('on'); $('#grid').style.display = ''; }
window.addEventListener('hashchange', () => location.hash.startsWith('#p') ? show(location.hash.slice(2)) : back());
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  lang = b.dataset.l; load();
});
$('#q').oninput = render;
load();
</script>
</body>
</html>
